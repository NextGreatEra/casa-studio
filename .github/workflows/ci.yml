name: ci
on:
  push:
    branches: [main, feat/npm-shell-fonts]
  pull_request:
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run preflight
      - uses: actions/upload-artifact@v4
        with:
          name: interior-preflight
          path: artifacts/interior-preflight.pdf
